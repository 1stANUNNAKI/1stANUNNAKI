name: Generate Dragon Contribution Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: "dragon-snake"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate 1stANUNNAKI Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 1stANUNNAKI
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish Snake Assets to Output Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b output
          git config user.name "1stANUNNAKI"
          git config user.email "1stANUNNAKI@users.noreply.github.com"
          git add -A
          git commit -m "chore(snake): update 1stANUNNAKI contribution grid snake"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/1stANUNNAKI/1stANUNNAKI.git" HEAD:refs/heads/output
